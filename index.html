<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | gorilla tag web</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fps-wrap">
          <label for="unity-fps-cap" style="font-size: 12px;">FPS</label>
          <input id="unity-fps-cap" type="range" min="1" max="250" value="60" />
          <output id="unity-fps-value" for="unity-fps-cap">60</output>
        </div>
        <button id="unity-webxr-button" type="button">VR Unavailable</button>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">gorilla tag web</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var webXRButton = document.querySelector("#unity-webxr-button");
      var fpsCapInput = document.querySelector("#unity-fps-cap");
      var fpsValue = document.querySelector("#unity-fps-value");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/gtagweb.loader.js";
      var config = {
        dataUrl: buildUrl + "/gtagweb.data.unityweb",
        frameworkUrl: buildUrl + "/gtagweb.framework.js.unityweb",
        codeUrl: buildUrl + "/gtagweb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "boolonx",
        productName: "gorilla tag web",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      function setWebXRButtonState(available) {
        webXRButton.style.background = available ? '#34c759' : '#d72638';
        webXRButton.style.color = '#ffffff';
        webXRButton.textContent = available ? 'Open in VR' : 'VR Unavailable';
        webXRButton.title = available ? 'Launch immersive VR' : 'VR is not available in this browser';
        webXRButton.disabled = !available;
        webXRButton.style.opacity = available ? '1' : '0.9';
      }

      function requestWebXR() {
        if (!navigator.xr || !navigator.xr.requestSession) {
          setWebXRButtonState(false);
          unityShowBanner("This browser does not support WebXR.", "warning");
          return;
        }

        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (!supported) {
            setWebXRButtonState(false);
            unityShowBanner("This browser does not support immersive VR.", "warning");
            return;
          }

          navigator.xr.requestSession('immersive-vr', {
            optionalFeatures: ['local-floor', 'hand-tracking'],
            requiredFeatures: ['local-floor']
          }).then((session) => {
            setWebXRButtonState(true);
            unityShowBanner("WebXR started. Your headset should now switch into VR mode.", "warning");
            console.log('WebXR session started:', session);
          }).catch((error) => {
            console.warn('WebXR request failed:', error);
            unityShowBanner("The VR request was blocked. Tap the button again when the page is ready.", "warning");
          });
        }).catch((error) => {
          console.warn('WebXR capability check failed:', error);
          setWebXRButtonState(false);
          unityShowBanner("This device could not check VR support.", "warning");
        });
      }

      webXRButton.onclick = requestWebXR;
      setWebXRButtonState(false);

      if (navigator.xr && navigator.xr.isSessionSupported) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          setWebXRButtonState(Boolean(supported));
        }).catch(() => {
          setWebXRButtonState(false);
        });
      }

      function installFpsCap() {
        if (window.__gtagwebFpsCapInstalled) {
          return;
        }

        var nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
        var nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
        var fpsLimit = 60;
        var rafMap = {};
        var nextId = 1;

        function scheduleFrame(callback) {
          var id = nextId++;
          rafMap[id] = nativeRequestAnimationFrame(function(timestamp) {
            var lastTimestamp = rafMap[id + 1000000];
            delete rafMap[id];
            if (lastTimestamp !== undefined && timestamp - lastTimestamp < 1000 / fpsLimit) {
              var remaining = (1000 / fpsLimit) - (timestamp - lastTimestamp);
              rafMap[id] = setTimeout(function() {
                delete rafMap[id];
                callback(timestamp + remaining);
              }, remaining);
              return;
            }
            rafMap[id + 1000000] = timestamp;
            callback(timestamp);
          });
          return id;
        }

        window.requestAnimationFrame = function(callback) {
          return scheduleFrame(callback);
        };

        window.cancelAnimationFrame = function(id) {
          if (rafMap[id]) {
            clearTimeout(rafMap[id]);
            delete rafMap[id];
          }
          return nativeCancelAnimationFrame(id);
        };

        window.__gtagwebFpsCapInstalled = true;
        window.__gtagwebSetFpsLimit = function(limit) {
          fpsLimit = Math.max(1, Math.min(250, Number(limit) || 60));
        };
      }

      function updateFpsCap(value) {
        var fps = Math.max(1, Math.min(250, Number(value) || 60));
        fpsValue.textContent = fps;
        fpsCapInput.value = fps;
        if (window.__gtagwebSetFpsLimit) {
          window.__gtagwebSetFpsLimit(fps);
        }
      }

      installFpsCap();
      fpsCapInput.addEventListener('input', function(event) {
        updateFpsCap(event.target.value);
      });
      updateFpsCap(fpsCapInput.value);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
